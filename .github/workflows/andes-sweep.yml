name: ANDES IEEE-14 sweep

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_andes_sweep.py"
      - ".github/workflows/andes-sweep.yml"
  workflow_dispatch:

concurrency:
  group: andes-ieee14-sweep-v0-1
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ANDES integration
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,andes]"
      - name: Run frozen IEEE-14 fault sweep
        run: python scripts/run_andes_sweep.py
      - name: Upload sweep dataset
        uses: actions/upload-artifact@v4
        with:
          name: gridguardpinn-andes-ieee14-sweep-v0.1
          path: artifacts/andes_ieee14_sweep_v0_1/
          retention-days: 30
