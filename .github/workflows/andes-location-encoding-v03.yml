name: ANDES network-aware location encoding v0.3

on:
  push:
    branches: [main]
    paths:
      - "experiments/trigger_andes_location_encoding_v03.txt"
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs per model
        required: true
        default: "1000"
      seeds:
        description: Space-separated frozen seeds
        required: true
        default: "17 29 41"

concurrency:
  group: andes-location-encoding-v0-3
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install PyTorch, ANDES, and project
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,andes]"
      - name: Verify location features and multi-machine physics
        run: |
          pytest tests/test_andes_location_features.py \
            tests/test_andes_surrogate_physics.py \
            tests/test_andes_gate.py \
            tests/test_andes_surrogate_protocol.py
      - name: Run pre-registered location encoding experiment
        env:
          EXPERIMENT_EPOCHS: ${{ inputs.epochs || '1000' }}
          EXPERIMENT_SEEDS: ${{ inputs.seeds || '17 29 41' }}
        run: |
          python scripts/run_andes_location_encoding.py \
            --epochs "$EXPERIMENT_EPOCHS" \
            --anchors 101 \
            --collocation 56 \
            --seeds $EXPERIMENT_SEEDS
      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gridguardpinn-andes-location-encoding-v0.3
          path: artifacts/andes_location_encoding_v0_3/
          retention-days: 30
