name: SMIB PINN experiment

on:
  push:
    branches: [main]
    paths:
      - "src/gridguardpinn/**"
      - "scripts/run_experiment.py"
      - "docs/experiment_spec_v0_2.md"
      - ".github/workflows/experiment-smib.yml"
  workflow_dispatch:

concurrency:
  group: smib-pinn-experiment-main
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run frozen v0.2 experiment
        run: |
          python scripts/run_experiment.py --epochs 400 --anchors 61 --collocation 48 --seed 7
      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gridguardpinn-smib-v0.2
          path: artifacts/experiment_v0_2/
          retention-days: 30
