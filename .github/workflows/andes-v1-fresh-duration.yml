name: ANDES v1 fresh-duration preregistered audit

on:
  push:
    branches: [main]
    paths:
      - "experiments/trigger_v1_fresh_duration.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: andes-v1-fresh-duration
  cancel-in-progress: true

jobs:
  fresh-duration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pinned simulator and model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,andes]"
      - name: Verify frozen pretrained source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/abhijith-sivaprasadan/GridGuardPINN/actions/artifacts/11612523064/zip > /tmp/frozen.zip
          echo "02a82e4d53544203376749e7054778b9b93a2a5d6af3c83ab7d2820fd24f6666  /tmp/frozen.zip" | sha256sum --check
          mkdir -p /tmp/frozen
          unzip -q /tmp/frozen.zip -d /tmp/frozen
      - name: Run frozen fresh-duration release-gate evaluation
        run: python scripts/run_andes_v1_fresh_duration.py --artifact-dir /tmp/frozen
      - name: Preserve outcomes including any failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridguardpinn-v1-fresh-duration
          path: artifacts/andes_v1_fresh_duration/
          retention-days: 90
