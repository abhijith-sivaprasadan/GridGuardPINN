name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Smoke-test frozen reference sweep
        run: |
          python scripts/run_reference_sweep.py
          test -s artifacts/reference_sweep.csv
      - name: Lint
        run: ruff check src tests scripts
