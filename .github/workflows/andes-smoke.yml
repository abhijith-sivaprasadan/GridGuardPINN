name: ANDES reference smoke

on:
  push:
    branches: [main]
    paths:
      - "src/gridguardpinn/andes_reference.py"
      - "scripts/run_andes_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/andes-smoke.yml"
  workflow_dispatch:

concurrency:
  group: andes-reference-smoke-main
  cancel-in-progress: true

jobs:
  andes-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ANDES integration
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,andes]"
      - name: Run Kundur fault reference
        run: python scripts/run_andes_smoke.py
      - name: Upload transient reference
        uses: actions/upload-artifact@v4
        with:
          name: gridguardpinn-andes-kundur-reference
          path: artifacts/andes_kundur_smoke/
          retention-days: 30
