name: ANDES v1 runtime integration smoke

on:
  push:
    branches: [main]
    paths:
      - "src/gridguardpinn/andes_runtime.py"
      - "src/gridguardpinn/andes_router.py"
      - "scripts/run_andes_runtime_smoke.py"
      - ".github/workflows/andes-runtime-smoke.yml"
  workflow_dispatch:

concurrency:
  group: andes-runtime-integration-main
  cancel-in-progress: true

jobs:
  runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install PyTorch and ANDES
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,andes]"
      - name: Run actual IEEE-14 reference and runtime integration smoke
        run: python scripts/run_andes_runtime_smoke.py
      - name: Preserve smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: gridguardpinn-andes-runtime-smoke
          path: artifacts/andes_runtime_smoke/
          retention-days: 30
